function silverman(data){
  const n=data.length;
  const mean=data.reduce((a,b)=>a+b,0)/n;
  const std=Math.sqrt(data.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
  return 0.9*std*Math.pow(n,-0.2);
}

function kde(data,h,xpts){
  return xpts.map(x=>{
    const s=data.reduce((acc,xi)=>acc+Math.exp(-0.5*((x-xi)/h)**2),0);
    return s/(data.length*h*Math.sqrt(2*Math.PI));
  });
}

function pct(arr,p){const s=[...arr].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(s.length*p))];}

    ctx.beginPath(); ctx.moveTo(lx,mt+16); ctx.lineTo(lx+22,mt+16); ctx.stroke();
    ctx.fillStyle='#333'; ctx.textAlign='left'; ctx.font=`12px 'Times New Roman', Times, serif`;
    ctx.fillText('Healthy',lx+26,mt+20);
    ctx.strokeStyle='#c62828';
    ctx.beginPath(); ctx.moveTo(lx,mt+34); ctx.lineTo(lx+22,mt+34); ctx.stroke();
    ctx.fillText('Damaged',lx+26,mt+38);
  }
}

drawPanel(A.h,A.d,ml,'(a) AE-plain');
drawPanel(B.h,B.d,ml+pw+gap,'(b) PGAE-A — attention');

// shared axis labels
ctx.fillStyle='#333'; ctx.font=`13px 'Times New Roman', Times, serif`; ctx.textAlign='center';
ctx.fillText('Anomaly score / threshold',ml+pw/2,H-8);
ctx.fillText('Anomaly score / threshold',ml+pw+gap+pw/2,H-8);
ctx.save(); ctx.translate(12,mt+ph/2); ctx.rotate(-Math.PI/2);
ctx.fillText('Density',0,0); ctx.restore();
