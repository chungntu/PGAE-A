const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W=620, H=360, ml=68, mr=24, mt=32, mb=52;
const DPR=4; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.scale(DPR,DPR);
const pw=W-ml-mr, ph=H-mt-mb;
const tr=DATA.train, vl=DATA.val, N=tr.length;
const ystep=0.25;
const ymax=Math.ceil(Math.max(...tr,...vl)*1.05/ystep)*ystep;
const ymin=0;
function px(i){return ml + i/(N-1)*pw;}
function py(v){return mt + ph - (v-ymin)/(ymax-ymin)*ph;}
// grid
ctx.strokeStyle='#ddd'; ctx.lineWidth=0.8;
for(let v=ystep; v<=ymax+1e-9; v+=ystep){
  const y=py(v);
  ctx.beginPath(); ctx.moveTo(ml,y); ctx.lineTo(ml+pw,y); ctx.stroke();
}
// axes
ctx.strokeStyle='#222'; ctx.lineWidth=1.6;
ctx.beginPath(); ctx.moveTo(ml,mt); ctx.lineTo(ml,mt+ph); ctx.lineTo(ml+pw,mt+ph); ctx.stroke();
// ticks + labels
ctx.fillStyle='#222'; ctx.font=`13px 'Times New Roman', Times, serif`; ctx.textAlign='center';
const steps=Math.min(N,10);
for(let i=0;i<=steps;i++){
  const ep=Math.round(i*(N-1)/steps);
  const x=px(ep);
  ctx.beginPath(); ctx.moveTo(x,mt+ph); ctx.lineTo(x,mt+ph+4); ctx.stroke();
  ctx.fillText(ep,x,mt+ph+17);
}
ctx.textAlign='right';
for(let v=0; v<=ymax+1e-9; v+=ystep){
  const y=py(v);
  ctx.beginPath(); ctx.moveTo(ml-4,y); ctx.lineTo(ml,y); ctx.stroke();
  ctx.fillText(v.toFixed(2),ml-7,y+4);
}
// axis labels
ctx.textAlign='center';
ctx.fillText('Epoch',ml+pw/2,H-6);
ctx.save(); ctx.translate(14,mt+ph/2); ctx.rotate(-Math.PI/2);
ctx.fillText('MSE Loss',0,0); ctx.restore();
// train line
ctx.strokeStyle='#1565c0'; ctx.lineWidth=2.0;
ctx.beginPath();
tr.forEach((v,i)=>i===0?ctx.moveTo(px(i),py(v)):ctx.lineTo(px(i),py(v)));
ctx.stroke();
// val line
ctx.strokeStyle='#e65100'; ctx.lineWidth=2.0; ctx.setLineDash([6,3]);
ctx.beginPath();
vl.forEach((v,i)=>i===0?ctx.moveTo(px(i),py(v)):ctx.lineTo(px(i),py(v)));
ctx.stroke(); ctx.setLineDash([]);
// legend
const lx=ml+pw-10, ly=mt+16;
ctx.strokeStyle='#1565c0'; ctx.lineWidth=2.0;
ctx.beginPath(); ctx.moveTo(lx-40,ly); ctx.lineTo(lx-10,ly); ctx.stroke();
ctx.fillStyle='#222'; ctx.textAlign='right'; ctx.font=`13px 'Times New Roman', Times, serif`;
ctx.fillText('Train',lx-44,ly+4);
ctx.strokeStyle='#e65100'; ctx.setLineDash([6,3]);
ctx.beginPath(); ctx.moveTo(lx-40,ly+22); ctx.lineTo(lx-10,ly+22); ctx.stroke();
ctx.setLineDash([]);
ctx.fillText('Validation',lx-44,ly+26);
