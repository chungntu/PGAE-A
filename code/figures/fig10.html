<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Figure 6 — ROC Curves</title>
<style>body{margin:0;background:#fff;padding:20px;}svg text{font-family:'Times New Roman', Times, serif;}</style>
</head><body>
<svg width="530" height="530" viewBox="0 0 530 530" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0,0 9,3.5 0,7" fill="#222"/></marker>
</defs>

<!-- Plot area: x=70..470, y=40..440  (400×400 square) -->

<!-- ── Axes ── -->
<line x1="70" y1="440" x2="475" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="70" y1="440" x2="70"  y2="35"  stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>

<!-- X ticks & labels: FPR 0.0–1.0 -->
<line x1="70"  y1="440" x2="70"  y2="447" stroke="#333" stroke-width="1.2"/>
<line x1="150" y1="440" x2="150" y2="447" stroke="#333" stroke-width="1.2"/>
<line x1="230" y1="440" x2="230" y2="447" stroke="#333" stroke-width="1.2"/>
<line x1="310" y1="440" x2="310" y2="447" stroke="#333" stroke-width="1.2"/>
<line x1="390" y1="440" x2="390" y2="447" stroke="#333" stroke-width="1.2"/>
<line x1="470" y1="440" x2="470" y2="447" stroke="#333" stroke-width="1.2"/>
<text x="70"  y="460" text-anchor="middle" font-size="14.5" fill="#111">0.0</text>
<text x="150" y="460" text-anchor="middle" font-size="14.5" fill="#111">0.2</text>
<text x="230" y="460" text-anchor="middle" font-size="14.5" fill="#111">0.4</text>
<text x="310" y="460" text-anchor="middle" font-size="14.5" fill="#111">0.6</text>
<text x="390" y="460" text-anchor="middle" font-size="14.5" fill="#111">0.8</text>
<text x="470" y="460" text-anchor="middle" font-size="14.5" fill="#111">1.0</text>
<text x="270" y="482" text-anchor="middle" font-size="16.7" fill="#111">False Positive Rate</text>

<!-- Y ticks & labels: TPR 0.0–1.0 -->
<line x1="70" y1="440" x2="63" y2="440" stroke="#333" stroke-width="1.2"/>
<line x1="70" y1="360" x2="63" y2="360" stroke="#333" stroke-width="1.2"/>
<line x1="70" y1="280" x2="63" y2="280" stroke="#333" stroke-width="1.2"/>
<line x1="70" y1="200" x2="63" y2="200" stroke="#333" stroke-width="1.2"/>
<line x1="70" y1="120" x2="63" y2="120" stroke="#333" stroke-width="1.2"/>
<line x1="70" y1="40"  x2="63" y2="40"  stroke="#333" stroke-width="1.2"/>
<text x="60" y="444" text-anchor="end" font-size="14.5" fill="#111">0.0</text>
<text x="60" y="364" text-anchor="end" font-size="14.5" fill="#111">0.2</text>
<text x="60" y="284" text-anchor="end" font-size="14.5" fill="#111">0.4</text>
<text x="60" y="204" text-anchor="end" font-size="14.5" fill="#111">0.6</text>
<text x="60" y="124" text-anchor="end" font-size="14.5" fill="#111">0.8</text>
<text x="60" y="44"  text-anchor="end" font-size="14.5" fill="#111">1.0</text>
<text x="22" y="240" text-anchor="middle" font-size="16.7" fill="#111" transform="rotate(-90,22,240)">True Positive Rate</text>

<!-- ── Diagonal (chance line) ── -->
<!-- (70,440)→(470,40) -->
<line x1="70" y1="440" x2="470" y2="40" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="420" y="95" font-size="13" fill="#999" font-style="italic">chance</text>

<!-- Scale: FPR 0→1 maps to x: 70→470 (400px); TPR 0→1 maps to y: 440→40 (400px) -->
<!-- px = 70 + FPR*400; py = 440 - TPR*400 -->

<!-- ── AE-plain curve (AUC=0.643, close to diagonal, solid thin) ── -->
<!-- Points (FPR, TPR): (0,0),(0.05,0.12),(0.1,0.24),(0.156,0.34),(0.2,0.43),(0.3,0.56),(0.4,0.67),(0.5,0.76),(0.7,0.88),(0.9,0.96),(1,1) -->
<!-- px,py: (70,440),(90,392),(110,344),(132,304),(150,268),(190,216),(230,172),(270,136),(350,88),(430,56),(470,40) -->
<polyline
  points="70,440 90,392 110,344 132,304 150,268 190,216 230,172 270,136 350,88 430,56 470,40"
  fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6,3"/>

<!-- ── PIAE-A curve (AUC=0.795, medium above diagonal, dashed) ── -->
<!-- Points: (0,0),(0.05,0.22),(0.1,0.40),(0.156,0.53),(0.2,0.63),(0.3,0.76),(0.4,0.86),(0.5,0.91),(0.7,0.96),(0.9,0.99),(1,1) -->
<!-- px,py: (70,440),(90,352),(110,280),(132,228),(150,188),(190,136),(230,96),(270,76),(350,56),(430,44),(470,40) -->
<polyline
  points="70,440 90,352 110,280 132,228 150,188 190,136 230,96 270,76 350,56 430,44 470,40"
  fill="none" stroke="#444" stroke-width="2.2" stroke-dasharray="8,4"/>

<!-- ── Elliptic Envelope curve (AUC=0.944, high, solid) ── -->
<!-- Points: (0,0),(0.05,0.68),(0.1,0.84),(0.156,0.92),(0.2,0.95),(0.3,0.97),(0.4,0.98),(0.6,0.99),(1,1) -->
<!-- px,py: (70,440),(90,168),(110,104),(132,72),(150,60),(190,52),(230,48),(310,44),(470,40) -->
<polyline
  points="70,440 90,168 110,104 132,72 150,60 190,52 230,48 310,44 470,40"
  fill="none" stroke="#222" stroke-width="2.4"/>

<!-- ── Legend (bottom-right) ── -->
<rect x="248" y="330" width="214" height="98" rx="5" fill="#fff" fill-opacity="0.92" stroke="#ccc" stroke-width="1"/>
<line x1="258" y1="350" x2="288" y2="350" stroke="#888" stroke-width="2"   stroke-dasharray="6,3"/>
<text x="294" y="354" font-size="13.5" fill="#111">AE-plain  (AUC = 0.643)</text>
<line x1="258" y1="372" x2="288" y2="372" stroke="#444" stroke-width="2.2" stroke-dasharray="8,4"/>
<text x="294" y="376" font-size="13.5" fill="#111">PIAE-A  (AUC = 0.795)</text>
<line x1="258" y1="394" x2="288" y2="394" stroke="#222" stroke-width="2.4"/>
<text x="294" y="398" font-size="13.5" fill="#111">Ell. Envelope  (AUC = 0.944)</text>
<line x1="258" y1="414" x2="288" y2="414" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="294" y="418" font-size="13.5" fill="#999" font-style="italic">chance</text>
